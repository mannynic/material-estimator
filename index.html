<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Material Estimator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        /* --- APPLE HIG DESIGN SYSTEM --- */
        :root {
            --bg-color: #f5f5f7;
            --card-color: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border-color: #d2d2d7;
            --input-bg: #f5f5f7;
            --ios-blue: #007aff;
            --ios-blue-hover: #0066cc;
            --ios-green: #34c759;
            --ios-red: #ff3b30;
            --ios-gray: #e5e5ea;
            --ios-gray-text: #1d1d1f;
            --ios-purple: #5856d6;
            --ios-orange: #ff9500;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04), 0 2px 10px rgba(0,0,0,0.02);
        }

        .company-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .company-logo {
            max-width: 300px;
            height: auto;
        }

        .header-actions {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); margin-bottom: 15px; padding-bottom: 15px;
        }

        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin: 0; display: flex; align-items: center; }
        
        .grid-header { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
        
        .form-group { margin-bottom: 12px; }
        
        label {
            display: block; font-weight: 600; font-size: 12px; color: var(--text-muted);
            margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        input[type="text"], input[type="file"], input[type="date"], input[type="number"], select, textarea {
            width: 100%; padding: 14px 16px; background-color: var(--input-bg);
            border: 1px solid transparent; border-radius: 12px; font-size: 14px;
            color: var(--text-main); box-sizing: border-box; transition: all 0.2s ease;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none; background-color: #fff; border-color: var(--ios-blue);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
        }

        .top-input {
            background-color: transparent !important;
            border: none !important;
            border-bottom: 2px solid var(--text-main) !important;
            border-radius: 0 !important;
            font-size: 18px !important;
            font-weight: 800 !important; 
            color: var(--text-main) !important;
            padding: 4px 0 !important;
            box-shadow: none !important;
        }

        .pdf-upload-section {
            margin-top: 15px;
            padding: 15px;
            background: #fcfcfd;
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        #pdfPreviewContainer {
            margin-top: 10px;
            display: none;
            align-items: center;
            gap: 15px;
        }

        #pdfThumbnail {
            width: 80px;
            height: 110px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            object-fit: cover;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #pdfFileName {
            font-size: 13px;
            font-weight: 600;
            color: var(--ios-blue);
            text-decoration: underline;
            cursor: pointer;
        }

        hr.main-separator {
            border: none;
            border-top: 4px solid #000;
            margin: 35px 0 10px 0;
            border-radius: 2px;
        }

        #tableContainer { margin-top: 20px; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { text-align: left; vertical-align: top; }
        
        .section-row td { background-color: transparent; padding-top: 35px; padding-bottom: 8px; border-bottom: none; }
        
        .section-labels-row th {
            font-size: 11px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color); padding: 8px 8px 12px 8px; vertical-align: middle;
        }
        
        tr.item-row td { padding: 12px 8px; border-bottom: 1px solid var(--border-color); }
        td input.item-input, td select.item-input { padding: 10px 12px; font-size: 13px; }

        .section-summary-row td { background-color: #fcfcfd; border-top: 1px dashed var(--border-color); border-bottom: 2px solid var(--border-color) !important; }

        .suggestions-box {
            position: absolute; top: calc(100% + 4px); left: 0; width: 100%; background: var(--card-color);
            border: 1px solid var(--border-color); border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); z-index: 1000; max-height: 220px; overflow-y: auto;
        }
        .suggestion-item {
            padding: 12px 14px; font-size: 13px; color: var(--text-main); cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: background 0.1s;
        }
        .suggestion-item:hover { background-color: var(--ios-blue); color: #fff; }

        .section-input {
            width: 100%; background: transparent; border: none; font-weight: 800; font-size: 16px; 
            color: var(--ios-blue); text-transform: uppercase; letter-spacing: 1px; padding: 5px 10px; outline: none;
            resize: none; overflow: hidden; min-height: 34px; line-height: 1.4; font-family: inherit;
        }
        
        .mult-container {
            display: flex; align-items: center; background: var(--ios-gray); padding: 6px 12px; 
            border-radius: 10px; border: 1px solid var(--border-color); flex-shrink: 0; margin-left: 15px;
        }

        .section-img-wrapper { display: flex; align-items: center; gap: 10px; padding: 4px; border-radius: 10px; border: 2px dashed transparent; transition: all 0.2s ease; flex-shrink: 0;}

        .btn {
            display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; 
            padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; transition: all 0.2s ease; 
            margin-right: 6px; margin-bottom: 10px; font-family: inherit;
        }
        .btn:active { transform: scale(0.97); }
        
        .btn-primary { background-color: var(--ios-blue); color: white; }
        .btn-success { background-color: var(--ios-green); color: white; }
        .btn-section { background-color: var(--ios-gray); color: var(--ios-gray-text); }
        .btn-share { background-color: rgba(0, 122, 255, 0.1); color: var(--ios-blue); }
        .btn-pdf { background-color: var(--text-main); color: white; }
        .btn-remove { background-color: rgba(255, 59, 48, 0.1); color: var(--ios-red); padding: 8px 12px; border-radius: 8px; font-size: 13px; margin: 0; }
        
        .summary { background: #fafafa; padding: 25px; border-radius: 16px; text-align: right; font-size: 16px; margin-top: 30px; border: 1px solid #f0f0f0; }
        .grand-total { font-size: 28px !important; font-weight: 700 !important; color: var(--text-main) !important; margin-top: 15px !important; padding-top: 15px; border-top: 1px solid var(--border-color); }

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: var(--card-color); padding: 35px; border-radius: 20px; width: 80%; max-width: 800px; max-height: 85vh; overflow-y: auto;
            display: flex; flex-direction: column;
        }

        @media print {
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .no-print { display: none !important; }
            input, textarea { border: none !important; background: transparent !important; }
            hr.main-separator { border-top: 4px solid #000 !important; }
        }
    </style>
</head>
<body>

<datalist id="uomList">
    <option value="pcs"></option><option value="sqin"></option><option value="sqm"></option>
    <option value="sqft"></option><option value="sht"></option><option value="set"></option>
    <option value="roll"></option><option value="ft"></option><option value="m"></option>
</datalist>

<div id="libraryModal" class="modal no-print"><div class="modal-content"><span style="cursor:pointer; float:right;" onclick="closeModal('libraryModal')">&times;</span><h2>Manage Library</h2><tbody id="libraryManagerBody"></tbody><button class="btn btn-primary" onclick="addNewLibraryItem()">+ New Item</button></div></div>

<div class="container" id="contentToPrint">
    <div class="company-header">
        <img src="https://i.ibb.co/3pXnF5y/Facade-Logo.png" alt="Facade Advertising" class="company-logo">
    </div>

    <div class="header-actions no-print">
        <h1>Project Material Estimator</h1>
        <div>
            <button class="btn btn-section" onclick="window.open(window.location.href.split('?')[0], '_blank')">📄 New Document</button>
            <button class="btn btn-projects" onclick="openProjectsManager()">📂 My Projects</button>
            <button class="btn btn-success" onclick="saveCurrentProject()" id="saveJoBtn">💾 Save Project</button>
        </div>
    </div>
    
    <div class="grid-header">
        <div>
            <div class="form-group">
                <label for="projectName">Project Name</label>
                <input type="text" id="projectName" class="top-input" placeholder="Enter project name...">
            </div>
            <div class="form-group">
                <label for="location">Location / Site</label>
                <input type="text" id="location" class="top-input" placeholder="e.g., SM Aura, Megamall...">
            </div>
            
            <div class="pdf-upload-section">
                <label class="no-print">📎 Official Production Layout (PDF)</label>
                <input type="file" id="pdfLayoutInput" accept="application/pdf" class="no-print" onchange="handlePDFUpload(this)">
                <div id="pdfPreviewContainer">
                    <canvas id="pdfThumbnail"></canvas>
                    <div style="display: flex; flex-direction: column;">
                        <span id="pdfFileName">Download Layout.pdf</span>
                        <span style="font-size: 11px; color: var(--text-muted);">Click name to download</span>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <div class="form-group">
                <label for="projectDate" style="text-align: right;">Date</label>
                <input type="date" id="projectDate" class="top-input" style="text-align: right;">
            </div>
            <div class="form-group image-upload-box no-print" id="mainImageDropZone">
                <label for="projectImage" style="cursor:pointer; margin-bottom:0; width: 100%; display: block;">
                    <span style="display:block;">📸</span> Upload Image
                </label>
                <input type="file" id="projectImage" accept="image/*" style="display:none;">
            </div>
            <div id="imagePreviewContainer" style="display: none; flex-direction: column; align-items: flex-end;">
                <div class="print-img-label">Overall Project Design</div>
                <div id="imagePreview"></div>
            </div>
        </div>
    </div>

    <hr class="main-separator">

    <div id="tableContainer">
        <table id="materialsTable">
            <colgroup><col width="32%"><col width="18%"><col width="14%"><col width="16%"><col width="15%"><col width="5%" class="no-print"></colgroup>
            <tbody id="materialsBody"></tbody>
        </table>
    </div>

    <div class="actions-bar no-print">
        <div>
            <button class="btn btn-primary" onclick="addRow()">+ Material</button>
            <button class="btn btn-section" onclick="addSection()">+ Section</button>
            <button class="btn btn-share" onclick="generateShareLink(false)" id="shareBtn">🔗 Share Link</button>
            <button class="btn btn-share" onclick="generateShareLink(true)" id="shareViewBtn" style="background-color: rgba(88, 86, 214, 0.1); color: var(--ios-purple);">👁️ View Only</button>
        </div>
        <div style="margin-top:10px;">
            <button class="btn btn-library" onclick="saveToLibrary()" id="saveLibBtn">Save to Library</button>
            <button class="btn btn-manage" onclick="openLibraryManager()">Manage Library</button>
            <button class="btn btn-pdf" onclick="window.print()">PDF</button>
        </div>
    </div>

    <div class="summary">
        <p>Subtotal: <span id="subtotal">₱0.00</span></p>
        <p>VAT (12%): <span id="vat">₱0.00</span></p>
        <p class="grand-total">Total: <span id="grandTotal">₱0.00</span></p>
    </div>
</div>

<script>
    const IMGBB_API_KEY = "c2bdac3065be1e1346bdb440b2287d48"; 
    let isRestoring = false, currentImageData = null, currentPDFData = null;
    let savedMaterials = [], savedProjects = [], currentProjectId = null;

    async function handlePDFUpload(input) {
        const file = input.files[0];
        if (file && file.type === "application/pdf") {
            const reader = new FileReader();
            reader.onload = async function() {
                currentPDFData = reader.result;
                document.getElementById('pdfFileName').innerText = file.name;
                document.getElementById('pdfPreviewContainer').style.display = 'flex';
                const loadingTask = pdfjsLib.getDocument({data: new Uint8Array(reader.result)});
                const pdf = await loadingTask.promise;
                const page = await pdf.getPage(1);
                const canvas = document.getElementById('pdfThumbnail'), context = canvas.getContext('2d');
                const viewport = page.getViewport({scale: 0.3});
                canvas.height = viewport.height; canvas.width = viewport.width;
                await page.render({canvasContext: context, viewport: viewport}).promise;
            };
            reader.readAsArrayBuffer(file);
        }
    }

    document.getElementById('pdfFileName').onclick = () => {
        if (currentPDFData) {
            const blob = new Blob([currentPDFData], {type: "application/pdf"});
            const url = URL.createObjectURL(blob), a = document.createElement('a');
            a.href = url; a.download = document.getElementById('pdfFileName').innerText; a.click();
        }
    };

    function calculate() {
        const rows = document.querySelectorAll(".item-row");
        let subtotal = 0;
        rows.forEach(row => {
            const qty = parseFloat(row.querySelector(".qty").value) || 0;
            const price = parseFloat(row.querySelector(".price").value.replace(/[^0-9.]/g, "")) || 0;
            const lineTotal = qty * price;
            row.querySelector(".line-total").innerText = "₱" + lineTotal.toLocaleString('en-PH', {minimumFractionDigits: 2});
            subtotal += lineTotal;
        });
        const vat = subtotal * 0.12, total = subtotal + vat;
        document.getElementById("subtotal").innerText = "₱" + subtotal.toLocaleString('en-PH', {minimumFractionDigits: 2});
        document.getElementById("vat").innerText = "₱" + vat.toLocaleString('en-PH', {minimumFractionDigits: 2});
        document.getElementById("grandTotal").innerText = "₱" + total.toLocaleString('en-PH', {minimumFractionDigits: 2});
    }

    function addRow() {
        const table = document.getElementById("materialsBody");
        const row = table.insertRow(); row.className = "item-row";
        row.innerHTML = `<td><input type="text" class="desc" placeholder="Description"></td><td>N/A</td><td><input type="number" class="qty" value="1" oninput="calculate()"></td><td><input type="text" class="price" value="0.00" oninput="calculate()"></td><td class="line-total">₱0.00</td><td class="no-print"><button onclick="this.parentElement.parentElement.remove(); calculate();">✕</button></td>`;
        calculate();
    }

    function addSection() {
        const table = document.getElementById("materialsBody");
        const row = table.insertRow(); row.className = "section-row";
        row.innerHTML = `<td colspan="5"><input type="text" class="section-input" placeholder="New Section"></td><td class="no-print"><button onclick="this.parentElement.parentElement.remove();">✕</button></td>`;
    }

    async function generateShareLink(makeViewOnly = false) {
        const btn = makeViewOnly ? document.getElementById('shareViewBtn') : document.getElementById('shareBtn');
        btn.innerHTML = "⏳ Generating...";
        try {
            const encodedData = LZString.compressToEncodedURIComponent(JSON.stringify({p: document.getElementById('projectName').value, l: document.getElementById('location').value}));
            const longUrl = window.location.href.split('?')[0] + "?data=" + encodedData + (makeViewOnly ? "&view=1" : "");
            const response = await fetch('https://spoo.me/', { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: `url=${encodeURIComponent(longUrl)}` });
            const data = await response.json();
            navigator.clipboard.writeText(data.short_url || longUrl);
            btn.innerHTML = "✅ Copied!"; setTimeout(() => btn.innerHTML = "🔗 Share", 2000);
        } catch (e) { btn.innerHTML = "Error"; }
    }

    window.onload = () => { addSection(); addRow(); };
</script>
</body>
</html>
